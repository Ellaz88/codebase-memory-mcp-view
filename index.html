<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>3D Codebase Graph Viewer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">Codebase 3D Graph</div>
      <div id="actions">
        <input id="fileInput" type="file" accept="application/json" aria-label="Load graph JSON" />
        <button id="fitBtn" title="Fit view">Fit</button>
        <button id="shareBtn" title="Copy share link">Share</button>
      </div>
    </header>

    <main id="viewer" role="main">
      <canvas id="three-canvas"></canvas>
      <div id="toast" class="hidden"></div>
    </main>

    <aside id="panel" class="hidden" aria-hidden="true">
      <button id="closePanel" aria-label="Close">×</button>
      <pre id="nodeInfo"></pre>
    </aside>

    <div id="loading">Loading…</div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
