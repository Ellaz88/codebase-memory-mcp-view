<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <meta name="description" content="Mobile-first 3D codebase graph viewer for JSON graph files." />
  <title>3D Codebase Graph Viewer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="appShell">
    <header class="topbar" aria-label="Graph viewer controls">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <strong>3D Graph Viewer</strong>
          <small id="graphStatus">Loading sample graph…</small>
        </div>
      </div>

      <nav class="actions" aria-label="Viewer actions">
        <label class="file-pill" for="fileInput">Upload</label>
        <input id="fileInput" type="file" accept=".json,application/json" />
        <button id="fitBtn" type="button">Fit</button>
        <button id="shareBtn" type="button">Share</button>
      </nav>
    </header>

    <main id="viewer" aria-label="Interactive 3D graph viewport">
      <canvas id="threeCanvas"></canvas>
      <section id="hud" aria-live="polite">
        <div><b id="nodeCount">0</b> nodes</div>
        <div><b id="edgeCount">0</b> edges</div>
        <div id="graphSource">/data/graph.json</div>
      </section>
      <section id="loading" class="status-card">Preparing 3D viewer…</section>
      <section id="toast" class="toast hidden" role="status"></section>
    </main>

    <aside id="nodePanel" class="node-panel hidden" aria-label="Node details">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Selected node</p>
          <h2 id="panelTitle">Node</h2>
        </div>
        <button id="closePanelBtn" type="button" aria-label="Close node details">×</button>
      </div>
      <dl id="panelDetails"></dl>
    </aside>

    <noscript>
      <div class="noscript">This viewer requires JavaScript enabled in your browser.</div>
    </noscript>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
